[project]
name = "tinytalk-server"
version = "0.1.0"
description = "Voice/dialog pipeline server for the Tiny Talk Adventures kids' storytelling app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "kokoro>=0.9.2",
    "soundfile>=0.12",
    "moshi_mlx>=0.2",
    "python-dotenv>=1.0",
    # Pinned to 0.34.0 after a two-round dependency conflict with the
    # already-installed moshi_mlx (Kyutai STT): diffusers>=0.38.0 needs
    # safetensors>=0.8.0-rc.0, but moshi_mlx==0.3.0 needs safetensors<0.6;
    # the next attempt, diffusers>=0.37.0,<0.38.0 (safetensors-compatible),
    # then hit a second, independent conflict on huggingface-hub
    # (diffusers==0.37.0 needs >=0.34.0, moshi_mlx needs <0.29). 0.34.0 is
    # the newest version compatible with both packages' constraints at
    # once (verified via a full `pip install` + `pip check` in this venv)
    # and still has the IP-Adapter/safety-checker API (load_ip_adapter,
    # set_ip_adapter_scale, nsfw_content_detected) this backend needs --
    # see docs/superpowers/plans/2026-09-11-storybook-page-art.md's Task 2
    # section for the full history.
    "diffusers>=0.34.0,<0.35.0",
    # Floor, not an exact pin: transformers is diffusers' dependency, not
    # pinned by the conflict above, but a fresh `pip install` re-resolving
    # to some future major version without ever being tested against
    # would be a silent risk -- 4.50.3 is what's actually installed and
    # verified working in this venv.
    "transformers>=4.50.3",
    "accelerate",
    "torch>=2.0",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because `tools/` and `tests/` sit alongside the package and would
# otherwise confuse setuptools' flat-layout auto-discovery.
[tool.setuptools]
packages = ["tinytalk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
