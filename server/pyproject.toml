[project]
name = "tinytalk-server"
version = "0.1.0"
description = "Voice/dialog pipeline server for the Tiny Talk Adventures kids' storytelling app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "kokoro>=0.9.2",
    "soundfile>=0.12",
    "moshi_mlx>=0.2",
    "python-dotenv>=1.0",
    "diffusers>=0.34.0,<0.35.0",
    "transformers",
    "accelerate",
    "torch>=2.0",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because `tools/` and `tests/` sit alongside the package and would
# otherwise confuse setuptools' flat-layout auto-discovery.
[tool.setuptools]
packages = ["tinytalk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
