name: TinyTalkApp
options:
  bundleIdPrefix: com.tinytalkadventures
# Local.xcconfig is gitignored (see Local.xcconfig.example) -- keeps a real
# Apple Developer Team ID out of the committed project.pbxproj. Missing on
# a fresh clone until you copy the example file, per that file's own
# instructions.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  TinyTalkApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      SWIFT_VERSION: "6.0"
    sources:
      - TinyTalkApp
    info:
      path: TinyTalkApp/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Tiny Talk Adventures needs the microphone to hear the story you're telling together."
    dependencies:
      - package: TinyTalkCore
        product: TinyTalkCore
      - package: TinyTalkCore
        product: TinyTalkPlatform
packages:
  TinyTalkCore:
    path: ../TinyTalkCore
