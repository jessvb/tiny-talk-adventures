name: TinyTalkApp
options:
  bundleIdPrefix: com.tinytalkadventures
# Local.xcconfig is gitignored (see Local.xcconfig.example) -- keeps a real
# Apple Developer Team ID out of the committed project.pbxproj. Missing on
# a fresh clone until you copy the example file, per that file's own
# instructions.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  TinyTalkApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      SWIFT_VERSION: "6.0"
    sources:
      - TinyTalkApp
    info:
      path: TinyTalkApp/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Tiny Talk Adventures needs the microphone to hear the story you're telling together."
        NSCameraUsageDescription: "Tiny Talk Adventures needs the camera so you can show it something to put in the story."
        # Without this key (even empty), iOS has no declared launch screen and
        # falls back to a legacy fixed-size compatibility window instead of
        # the device's real screen bounds -- on an iPhone 13 Pro this showed
        # up as the whole app (SwiftUI content AND native sheets like the
        # camera picker) rendering letterboxed with black bars top/bottom,
        # confirmed by comparing on-device screenshots against the design.
        UILaunchScreen: {}
    dependencies:
      - package: TinyTalkCore
        product: TinyTalkCore
      - package: TinyTalkCore
        product: TinyTalkPlatform
packages:
  TinyTalkCore:
    path: ../TinyTalkCore
